name: Build Release (EXE + APK)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend test suite
        run: python -m pytest tests/ -v

  build-windows-exe:
    needs: [tests]
    runs-on: windows-latest
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build native Windows app
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Set-Location mobile_app
          flutter pub get
          flutter build windows --release
          $bundle = Join-Path $PWD 'build/windows/x64/runner/Release'
          $exe = Join-Path $bundle 'lamaliva_app.exe'
          if (-not (Test-Path $exe)) { throw "Native Windows executable missing: $exe" }
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'windows-artifacts'
          $packageDir = Join-Path $env:RUNNER_TEMP 'windows-package'
          New-Item -ItemType Directory -Force -Path $artifactDir, $packageDir | Out-Null
          Copy-Item (Join-Path $bundle '*') -Destination $packageDir -Recurse -Force
          Copy-Item $exe (Join-Path $artifactDir "La-Maliva-Vista-$version.exe")
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath (Join-Path $artifactDir "La-Maliva-Vista-$version-windows.zip") -CompressionLevel Optimal -Force

      - name: Archive Windows release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-exe
          path: windows-artifacts/*
          if-no-files-found: error

  build-android-apk:
    needs: [tests]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > mobile_app/android/la-maliva-release.jks
          cat > mobile_app/android/key.properties <<EOF
          storePassword=$KS_PASS
          keyPassword=$KEY_PASS
          keyAlias=lamaliva
          storeFile=../la-maliva-release.jks
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd mobile_app
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
             "../la-maliva-vista-${version}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: la-maliva-vista-*.apk
          if-no-files-found: error

  release:
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-artifacts/android-apk/*.apk release-artifacts/windows-exe/*.exe release-artifacts/windows-exe/*.zip)
          if [ "${#assets[@]}" -ne 3 ]; then
            echo "Expected APK, Windows EXE, and Windows ZIP; found ${#assets[@]} assets" >&2
            printf '%s\n' "${assets[@]}"
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber

      - name: Stage release bundles on the website
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git fetch origin main
          git switch --create "release-stage-${GITHUB_RUN_ID}" origin/main
          mkdir -p static/releases
          cp "release-artifacts/android-apk/la-maliva-vista-${version}.apk" static/releases/
          cp "release-artifacts/windows-exe/La-Maliva-Vista-${version}-windows.zip" static/releases/
          git config user.email 'noreply@codebuff.com'
          git config user.name 'Codebuff'
          git add "static/releases/la-maliva-vista-${version}.apk" \
                  "static/releases/La-Maliva-Vista-${version}-windows.zip"
          if ! git diff --cached --quiet; then
            git commit -m "Stage ${GITHUB_REF_NAME} release bundles for the downloads page"
            git push origin "HEAD:refs/heads/main"
          else
            echo "Release bundles are already staged on main; nothing to push."
          fi
