name: Build Release (EXE + APK)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend test suite
        run: python -m pytest tests/ -v

  build-windows-exe:
    needs: [tests]
    runs-on: windows-latest
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # `instance/` (the local SQLite data folder) is gitignored, so it must be
      # created on the runner or --add-data will abort the PyInstaller build.
      - name: Create instance directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path instance | Out-Null

      - name: Build server executable
        run: >
          pyinstaller --noconfirm --clean
          --name La-Maliva-Vista-Server
          --add-data "templates;templates"
          --add-data "static;static"
          --add-data "instance;instance"
          --hidden-import email_validator
          --hidden-import dns.resolver
          app.py

      - name: Zip bundle
        shell: pwsh
        run: Compress-Archive -Path dist/La-Maliva-Vista-Server -DestinationPath La-Maliva-Vista-Setup-${{ github.ref_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-exe
          path: La-Maliva-Vista-Setup-${{ github.ref_name }}.zip

  build-android-apk:
    needs: [tests]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > mobile_app/android/la-maliva-release.jks
          cat > mobile_app/android/key.properties <<EOF
          storePassword=$KS_PASS
          keyPassword=$KEY_PASS
          keyAlias=lamaliva
          storeFile=../la-maliva-release.jks
          EOF

      - name: Build APK
        run: |
          cd mobile_app
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
             ../la-maliva-vista-${{ github.ref_name }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: la-maliva-vista-${{ github.ref_name }}.apk

  release:
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-exe/*
            android-apk/*
