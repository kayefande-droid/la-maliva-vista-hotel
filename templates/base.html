        /* --- General Body & Background --- */
        body {

        /* --- Glassmorphism Effect for Panels/Cards --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.15); /* Semi-transparent white */
            backdrop-filter: blur(10px); /* Frosted effect */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3); /* Light border */
            border-radius: 0.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            color: #e0e0e0; /* Lighter text */
        }

        /* --- Accent Colors --- */
        .text-gold { color: #ffb700 !important; }
        .bg-gold-gradient {
            background: linear-gradient(135deg, #ffb700 0%, #ff9500 100%);

        }
        .bg-darkblue-gradient {
            background: linear-gradient(135deg, #001a4d, #003d99);
            color: #e0e0e0;
        }

        /* --- General Card Styling --- */
        .card {
            border-radius: 0.5rem;

            color: #e0e0e0;
        }
        .card-header {
            background-color: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffb700; /* Gold header text */
        }
        .card-body {
            color: #e0e0e0;
        }

        /* --- Buttons --- */
        .btn {
            border-radius: 0.3rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-gold {
            @extend .bg-gold-gradient; /* Use the gold gradient */
            border: none;
            color: #001a4d;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 183, 0, 0.4);
            color: #001a4d;
        }
        .btn-gold:active {
            transform: translateY(0);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        /* --- Main Content Area --- */
        .main-content {
            @extend .glass-panel;
            padding: 20px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        /* --- Headers and Titles --- */
        h1, h2, h3, h4, h5, h6 {
            color: #ffb700; /* Gold for all headers */
            font-weight: 600;
        }
        .text-primary { color: #007bff !important; } /* Keep Bootstrap primary for specific uses */
        .text-warning { color: #ffb700 !important; } /* Use gold for warning */
        .text-danger { color: #dc3545 !important; }
        .text-success { color: #28a745 !important; }

        /* --- Badges --- */
        .badge {
            padding: 0.4em 0.7em;
            border-radius: 0.3rem;
            font-weight: 500;
        }

        /* --- Alerts --- */
        .alert {
            border-radius: 0.3rem;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #e0e0e0;
        }
        .alert-success { background-color: rgba(40, 167, 69, 0.2); border-color: #28a745; }
        .alert-info { background-color: rgba(23, 162, 184, 0.2); border-color: #17a2b8; }
        .alert-warning { background-color: rgba(255, 193, 7, 0.2); border-color: #ffc107; }
        .alert-danger { background-color: rgba(220, 53, 69, 0.2); border-color: #dc3545; }

        /* --- SPLASH SCREEN STYLES --- */
        #pwa-splash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #001a4d, #003d99); /* Dark blue gradient */
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: opacity 1.5s ease-out; /* 1.5s transition */

        #pwa-splash.hidden {
            opacity: 0;
            pointer-events: none;

        .splash-logo {

            color: #001a4d; /* Dark text for contrast */

        #chatbot-window {

        #chatbot-close {

        #chatbot-messages {

        .bot-message {

        #chatbot-input-area {

        #chatbot-input {

            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        #chatbot-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        #chatbot-send {

            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Top Menu --- */
        .top-menu {
            background: linear-gradient(135deg, #001a4d, #003d99); /* Dark blue gradient */
            color: white;
            padding: 8px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        .top-menu .navbar-nav .nav-link {

            padding: 0.5rem 1rem;
            border-radius: 0.3rem;
            transition: all 0.3s ease;
        }
        .top-menu .navbar-nav .nav-link:hover {
            background-color: rgba(255, 183, 0, 0.2); /* Gold transparent hover */

        }
        .top-menu .dropdown-menu {

            padding: 0;
            overflow: hidden;
        }
        .top-menu .dropdown-item {
            color: #e0e0e0; /* Lighter text */
            padding: 0.5rem 1rem;
            transition: all 0.2s ease;
        }
        .top-menu .dropdown-item:hover {

            color: #ffb700; /* Gold text on hover */
        }
        .top-menu .dropdown-item i {

            color: #ffb700; /* Gold icons */
        }

        /* --- Sidebar --- */
        .sidebar {
            @extend .glass-panel;
            padding: 20px;
            width: 220px;
        }
        .sidebar h6 {
            color: #ffb700; /* Gold for sidebar titles */
        }

            color: #e0e0e0;
            border-color: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
