{% extends 'base.html' %}
{% block content %}
<style>
    .calendar-header {
        background: linear-gradient(135deg, rgba(10, 22, 40, 0.6), rgba(15, 34, 64, 0.6));
        color: white;
        padding: 25px;
        border-radius: 0.75rem;
        margin-bottom: 25px;
        animation: slideInDown 0.6s ease-out;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        border: 1px solid var(--shell-line);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }
    .calendar-header h5 {
        color: #eec37a;
        font-size: 24px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        margin-bottom: 0;
    }
    .calendar-header small { color: #f5f1e8; }
    @keyframes slideInDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .calendar-container {
        background: rgba(253, 250, 244, 0.05);
        border: 1px solid var(--shell-line);
        border-radius: 0.75rem;
        padding: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ---- FullCalendar (standard bundle) brand theme ---- */
    .fc {
        border-radius: 0.75rem;
        overflow: hidden;
        color: var(--shell-text);
        --fc-border-color: var(--shell-line);
        --fc-page-bg-color: transparent;
        --fc-neutral-bg-color: rgba(253,250,244,0.05);
        --fc-today-bg-color: rgba(240, 140, 46, 0.12);
    }
    .fc .fc-toolbar-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: #fff;
    }
    .fc .fc-button {
        background: linear-gradient(135deg, #0f2240, #16305c);
        border: 1px solid var(--shell-line);
        color: var(--shell-text);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-radius: 0.5rem;
        transition: all 0.25s ease;
    }
    .fc .fc-button:hover, .fc .fc-button-active {
        background: linear-gradient(135deg, #d97a2b, #f08c2e);
        border-color: rgba(240,140,46,.5);
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(240, 140, 46, 0.35);
    }
    .fc .fc-button:disabled {
        background: rgba(253,250,244,0.06);
        color: rgba(245,241,232,0.4);
        transform: none;
    }
    .fc .fc-col-header-cell {
        background: rgba(15, 34, 64, 0.6);
        color: #eec37a;
        font-weight: 700;
        padding: 10px 0;
    }
    .fc .fc-daygrid-day-number, .fc .fc-list-day-text, .fc .fc-list-day-side-text { color: var(--shell-text); }
    .fc .fc-event {
        border: 1px solid rgba(240,140,46,.55);
        border-radius: 4px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .fc .fc-event:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 16px rgba(240, 140, 46, 0.4);
    }
    .fc .fc-event-title { font-weight: 700; color: #fff; }
    .fc .fc-daygrid-dot-event .fc-event-title { color: var(--shell-text); }

    .calendar-loading {
        text-align: center;
        padding: 50px;
        color: #f5f1e8;
        font-size: 18px;
    }
    .calendar-loading i {
        font-size: 48px;
        color: #eec37a;
        animation: spin 2s linear infinite;
        margin-bottom: 20px;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
        .calendar-container { padding: 10px; }
        .fc { font-size: 12px; }
        .fc .fc-toolbar { flex-direction: column; gap: 8px; }
    }
</style>

<div class="container-fluid">
    <div class="main-content glass-panel">
        <div class="calendar-header">
            <div>
                <h5><i class="bi bi-calendar-range"></i> Reservation Calendar</h5>
                <small>LA-MALIVA VISTA HOTEL &bull; Real-time Room Occupancy &mdash; click a booking to open its invoice</small>
            </div>
            <img src="{{ url_for('static', filename='logo.png') }}" alt="La-Maliva Vista" style="height: 40px; opacity: 0.8;">
        </div>

        <div class="calendar-container">
            <div id="calendar-loading" class="calendar-loading">
                <i class="bi bi-calendar-week"></i>
                <div>Loading Reservation Calendar...</div>
            </div>
            <div id="calendar" style="display: none;"></div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const loadingDiv = document.getElementById('calendar-loading');
    const calendarDiv = document.getElementById('calendar');

    async function loadJSON(url, fallback) {
        try {
            const r = await fetch(url);
            if (!r.ok) throw new Error(url + ' -> ' + r.status);
            return await r.json();
        } catch (err) {
            console.error('Error fetching ' + url, err);
            return fallback;
        }
    }

    Promise.all([
        loadJSON('/api/rooms', []),
        loadJSON('/api/reservations', [])
    ]).then(([rooms, events]) => {
        loadingDiv.style.display = 'none';
        calendarDiv.style.display = 'block';

        // Room list doubles as the resource legend; statuses tint event dots
        const statusColor = {
            'Checked-In':  '#2ea043',
            'Checked-Out': '#6c757d',
            'Confirmed':   '#f08c2e',
            'Pending':     '#f0b429',
            'Cancelled':   '#dc3545'
        };
        events.forEach(ev => {
            if (!ev.backgroundColor) {
                const res = rooms.find(r => r.id === String(ev.resourceId));
                const st = res && res.extendedProps ? res.extendedProps.status : (ev.status || 'Confirmed');
                ev.backgroundColor = statusColor[st] || '#f08c2e';
                ev.borderColor = 'rgba(240,140,46,.55)';
            }
        });

        // Standard FullCalendar bundle: month / list views (timeline is premium-only)
        const calendar = new FullCalendar.Calendar(calendarDiv, {
            initialView: window.innerWidth < 768 ? 'listWeek' : 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,listWeek'
            },
            events: events,
            height: 'auto',
            initialDate: new Date(),
            nowIndicator: true,
            dayMaxEventRows: 4,
            eventClick: function(info) {
                if (confirm('Open reservation invoice #' + info.event.id + '?')) {
                    window.location = '/invoice/' + info.event.id;
                }
            },
            eventTimeFormat: { hour: '2-digit', minute: '2-digit', meridiem: false }
        });
        calendar.render();
    }).catch(error => {
        console.error('Calendar initialization error:', error);
        loadingDiv.innerHTML = '<i class="bi bi-exclamation-triangle" style="color: #eec37a;"></i><div style="color: #f5f1e8;">Error loading calendar. Please refresh the page.</div>';
    });
});
</script>
{% endblock %}
