{% extends 'base.html' %}
{% block content %}
<style>
    /* Specific styles for calendar.html, overriding/extending base.html where needed */
    .calendar-header {
        background: linear-gradient(135deg, rgba(0, 21, 51, 0.6), rgba(0, 42, 102, 0.6)); /* Deeper dark blue gradient */
        color: white;
        padding: 25px;
        border-radius: 0.75rem;
        margin-bottom: 25px;
        animation: slideInDown 0.6s ease-out;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.4); /* Glassmorphism border */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }
    .calendar-header h5 {
        color: #ffc107; /* Brighter gold text */
        font-size: 24px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        margin-bottom: 0;
    }
    .calendar-header small {
        color: #f0f0f0; /* Brighter text */
    }
    @keyframes slideInDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .calendar-container {
        background: rgba(255, 255, 255, 0.15); /* Semi-transparent white */
        border: 1px solid rgba(255, 193, 7, 0.5); /* Brighter gold border */
        border-radius: 0.75rem;
        padding: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    .fc {
        border: 2px solid #ffc107 !important; /* Brighter gold border for calendar */
        border-radius: 0.75rem;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08); /* Transparent calendar background */
        color: #f0f0f0; /* Default text color for calendar */
    }
    .fc .fc-button-primary {
        background: linear-gradient(135deg, #001533, #002a66) !important; /* Deeper dark blue gradient buttons */
        border-color: rgba(255, 255, 255, 0.4) !important;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        border-radius: 0.5rem !important;
        font-weight: bold !important;
        color: white !important;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .fc .fc-button-primary:hover {
        background: linear-gradient(135deg, #ffc107, #ff9800) !important; /* Brighter gold gradient on hover */
        border-color: #ffc107 !important;
        color: #001533 !important; /* Dark text for contrast */
        transform: translateY(-3px);
        box-shadow: 0 4px 12px rgba(255, 193, 7, 0.4);
    }
    .fc .fc-button-primary.fc-button-active {
        background: linear-gradient(135deg, #ffc107, #ff9800) !important; /* Brighter gold gradient when active */
        border-color: #ffc107 !important;
        color: #001533 !important;
    }
    .fc .fc-col-header-cell {
        background: linear-gradient(135deg, #001533, #002a66) !important; /* Deeper dark blue gradient header */
        color: #ffc107 !important; /* Brighter gold text */
        font-weight: bold !important;
        border-color: rgba(255, 193, 7, 0.5) !important; /* Brighter gold border */
        padding: 12px !important;
    }
    .fc .fc-timegrid-slot {
        height: 2.5em;
        border-color: rgba(255, 255, 255, 0.15) !important;
    }
    .fc .fc-resource-area {
        background: rgba(0, 0, 0, 0.15) !important; /* Slightly darker transparent */
        border-right: 2px solid #ffc107 !important; /* Brighter gold border */
    }
    .fc .fc-resource-area header {
        background: linear-gradient(135deg, #ffc107, #ff9800) !important; /* Brighter gold gradient header */
        color: #001533 !important; /* Dark text for contrast */
        font-weight: bold !important;
        padding: 10px !important;
    }
    .fc .fc-daygrid-day:hover {
        background: rgba(255, 193, 7, 0.15) !important; /* Subtle brighter gold hover */
    }
    .fc .fc-event {
        background: linear-gradient(135deg, #001533, #002a66) !important; /* Deeper dark blue gradient event */
        border: 2px solid #ffc107 !important; /* Brighter gold border */
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        border-radius: 4px !important;
        font-weight: bold !important;
        color: white !important;
    }
    .fc .fc-event:hover {
        box-shadow: 0 8px 16px rgba(255, 193, 7, 0.5) !important; /* Brighter gold shadow on hover */
        transform: scale(1.02);
    }
    .fc .fc-event-title {
        font-weight: bold !important;
        color: #ffc107 !important; /* Brighter gold text */
    }
    .fc .fc-resource-title {
        font-weight: bold !important;
        color: #ffc107 !important; /* Brighter gold text */
    }
    .calendar-loading {
        text-align: center;
        padding: 50px;
        color: #f0f0f0; /* Brighter text */
        font-size: 18px;
    }
    .calendar-loading i {
        font-size: 48px;
        color: #ffc107; /* Brighter gold icon */
        animation: spin 2s linear infinite;
        margin-bottom: 20px;
    }
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    @media (max-width: 768px) {
        .calendar-container {
            padding: 10px;
        }
        .fc {
            font-size: 12px;
        }
        .fc .fc-col-header-cell {
            padding: 8px !important;
        }
    }
</style>

<div class="container-fluid">
    <div class="main-content glass-panel">
        <div class="calendar-header">
            <div>
                <h5><i class="bi bi-calendar-range"></i> Reservation Calendar</h5>
                <small>LA-MALIVA VISTA HOTEL • Real-time Room Occupancy</small>
            </div>
            <img src="https://cdn-icons-png.flaticon.com/512/1524/1524815.png" alt="Hotel Key" style="height: 40px; opacity: 0.8; animation: spin 20s linear infinite;">
        </div>

        <div class="calendar-container">
            <div id="calendar-loading" class="calendar-loading">
                <i class="bi bi-calendar-week"></i>
                <div>Loading Reservation Calendar...</div>
            </div>
            <div id="calendar" style="height: 700px; display: none;"></div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const loadingDiv = document.getElementById('calendar-loading');
    const calendarDiv = document.getElementById('calendar');

    // Show loading initially
    loadingDiv.style.display = 'block';
    calendarDiv.style.display = 'none';

    // Fetch data and initialize calendar
    Promise.all([
        fetch('/api/rooms').then(r => r.json()).catch(err => {
            console.error('Error fetching rooms:', err);
            return [];
        }),
        fetch('/api/reservations').then(r => r.json()).catch(err => {
            console.error('Error fetching reservations:', err);
            return [];
        })
    ]).then(([resources, events]) => {
        // Hide loading, show calendar
        loadingDiv.style.display = 'none';
        calendarDiv.style.display = 'block';

        // Initialize FullCalendar
        var calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'resourceTimelineDay',
            editable: true,
            resources: resources,
            events: events,
            resourceLabelText: 'Rooms',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'resourceTimelineDay,resourceTimelineWeek,resourceTimelineMonth'
            },
            eventClick: function(info) {
                if (confirm('Open reservation details?')) {
                    window.location = '/invoice/' + info.event.id;
                }
            },
            resourceAreaWidth: '200px',
            slotMinTime: '06:00:00',
            slotMaxTime: '24:00:00',
            height: 'auto',
            contentHeight: 600,
            aspectRatio: 1.8,
            eventDisplay: 'block',
            eventTimeFormat: {
                hour: '2-digit',
                minute: '2-digit',
                meridiem: false
            }
        });

        calendar.render();
    }).catch(error => {
        console.error('Calendar initialization error:', error);
        loadingDiv.innerHTML = '<i class="bi bi-exclamation-triangle" style="color: #ffc107;"></i><div style="color: #f0f0f0;">Error loading calendar. Please refresh the page.</div>';
    });
});
</script>
{% endblock %}
