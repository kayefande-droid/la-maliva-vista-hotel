<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>429 - Too Many Requests - LA-MALIVA VISTA HOTEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --navy: #001533;
            --charcoal: #002a66;
            --gold: #DAA520;
            --white: #ffffff;
            --orange: #ff9800;
        }

        body {
            background: linear-gradient(180deg, var(--navy), var(--charcoal));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .error-container {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            padding: 3rem;
            text-align: center;
            color: var(--white);
            max-width: 500px;
            width: 90%;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: var(--orange);
            margin-bottom: 1rem;
            line-height: 1;
        }

        .error-title {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            color: var(--white);
        }

        .error-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .wait-time {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--gold);
            margin: 1.5rem 0;
        }

        .btn-home {
            background: var(--gold);
            color: var(--navy);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .btn-home:hover {
            background: #c58e0a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">429</div>
        <h1 class="error-title">Too Many Requests</h1>
        <p class="error-message">
            You've made too many requests in a short amount of time. Please wait before trying again.
        </p>
        <div class="wait-time">
            Please wait {{ retry_after }} seconds before trying again.
        </div>
        <a href="{{ url_for('public_home') }}" class="btn-home">
            <i class="bi bi-house-door"></i> Return to Homepage
        </a>
    </div>
</body>
</html>
