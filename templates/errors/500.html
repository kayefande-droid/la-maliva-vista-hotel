<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error - LA-MALIVA VISTA HOTEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --navy: #001533;
            --charcoal: #002a66;
            --gold: #DAA520;
            --white: #ffffff;
            --red: #dc3545;
        }

        body {
            background: linear-gradient(180deg, var(--navy), var(--charcoal));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .error-container {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            padding: 3rem;
            text-align: center;
            color: var(--white);
            max-width: 500px;
            width: 90%;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: var(--red);
            margin-bottom: 1rem;
            line-height: 1;
        }

        .error-title {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            color: var(--white);
        }

        .error-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .btn-home {
            background: var(--gold);
            color: var(--navy);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .btn-home:hover {
            background: #c58e0a;
            transform: translateY(-2px);
        }

        .btn-report {
            background: rgba(255, 255, 255, 0.2);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.75rem 2rem;
            font-weight: 500;
            border-radius: 0.5rem;
            font-size: 1rem;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }
        .btn-report:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">500</div>
        <h1 class="error-title">Internal Server Error</h1>
        <p class="error-message">
            Something went wrong on our end. Please try again later or contact support if the problem persists.
        </p>
        <a href="{{ url_for('public_home') }}" class="btn-home me-2">
            <i class="bi bi-house-door"></i> Return to Homepage
        </a>
        <a href="mailto:info@lamaliva.com" class="btn-report">
            <i class="bi bi-headset"></i> Report Issue
        </a>
    </div>
</body>
</html>
