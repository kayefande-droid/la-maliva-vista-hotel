{% extends 'base.html' %}
{% block content %}
<style>
    /* Specific styles for guests.html, overriding/extending base.html where needed */
    .guests-header {
        background: linear-gradient(135deg, rgba(10, 22, 40, 0.6), rgba(15, 34, 64, 0.6)); /* Deeper dark blue gradient */
        color: white;
        padding: 20px;
        border-radius: 0.75rem;
        margin-bottom: 20px;
        animation: slideInDown 0.6s ease-out;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.4); /* Glassmorphism border */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }
    .guests-header h5 {
        color: #eec37a; /* Brighter gold text */
        font-size: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        margin-bottom: 0;
    }
    .guests-header small {
        color: #f5f1e8; /* Brighter text */
    }
    @keyframes slideInDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .guests-table {
        background-color: rgba(255, 255, 255, 0.08) !important; /* Transparent table background */
        border: 1px solid rgba(238, 195, 122, 0.5) !important; /* Brighter gold border */
        border-radius: 0.75rem;
        overflow: hidden;
        animation: fadeIn 0.6s ease-out;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #f5f1e8; /* Brighter text */
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    .guests-table thead {
        background: linear-gradient(135deg, #0f2240, #16305c) !important; /* Deeper dark blue gradient header */
        color: #eec37a !important; /* Brighter gold text */
        font-weight: bold;
    }
    .guests-table thead th {
        border-color: rgba(238, 195, 122, 0.5) !important; /* Brighter gold border */
        padding: 15px;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.5px;
    }
    .guests-table tbody tr {
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        transition: all 0.3s ease;
    }
    .guests-table tbody tr:hover {
        background: rgba(238, 195, 122, 0.15); /* Subtle brighter gold hover */
        box-shadow: inset 3px 0 0 #eec37a; /* Brighter gold left border on hover */
        transform: translateX(5px);
        color: #eec37a; /* Brighter gold text on hover */
    }
    .guests-table tbody td {
        padding: 12px 15px;
        vertical-align: middle;
    }
    .guest-name {
        color: #eec37a; /* Brighter gold text */
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .guest-contact {
        color: #f5f1e8; /* Brighter text */
    }
    .table-responsive {
        animation: slideUp 0.6s ease-out;
    }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="container-fluid">
    <div class="main-content glass-panel">
        <div class="guests-header">
            <div>
                <h5><i class="bi bi-people"></i> Guest Database</h5>
                <small>Manage and view all registered guests</small>
            </div>
            <img src="{{ url_for('static', filename='logo.png') }}" alt="La-Maliva Vista" style="height: 40px; opacity: 0.8;">
        </div>

        <div class="action-grid mb-4">
            <a class="action-btn primary" href="{{ url_for('new_reservation') }}"><i class="bi bi-plus-circle"></i> New Reservation</a>
            <a class="action-btn" href="{{ url_for('reservations') }}"><i class="bi bi-list-check"></i> Reservations</a>
            <a class="action-btn" href="{{ url_for('todays_arrivals') }}"><i class="bi bi-box-arrow-in-down"></i> Arrivals</a>
            <button class="action-btn" onclick="window.print()"><i class="bi bi-printer"></i> Print List</button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-sm guests-table mb-0">
                <thead>
                    <tr>
                        <th><i class="bi bi-person-fill"></i> Name</th>
                        <th><i class="bi bi-telephone-fill"></i> Phone</th>
                        <th><i class="bi bi-envelope-fill"></i> Email</th>
                    </tr>
                </thead>
                <tbody>
                    {% for g in guests %}
                    <tr>
                        <td><span class="guest-name"><i class="bi bi-star"></i> {{ g.name }}</span></td>
                        <td><span class="guest-contact">{{ g.phone }}</span></td>
                        <td><span class="guest-contact">{{ g.email }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
