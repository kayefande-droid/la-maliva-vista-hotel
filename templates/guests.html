{% extends 'base.html' %}
{% block content %}
<style>
    /* Specific styles for guests.html, overriding/extending base.html where needed */
    .guests-header {
        background: linear-gradient(135deg, rgba(0, 26, 77, 0.6), rgba(0, 61, 153, 0.6)); /* Dark blue gradient */
        color: white;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        animation: slideInDown 0.6s ease-out;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.3); /* Glassmorphism border */
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }
    @keyframes slideInDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .guests-header h5 {
        color: #ffb700; /* Gold text */
        font-size: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        margin-bottom: 0;
    }
    .guests-header small {
        color: #e0e0e0; /* Lighter text */
    }
    .guests-table {
        background-color: rgba(255, 255, 255, 0.05) !important; /* Transparent table background */
        border: 1px solid rgba(255, 183, 0, 0.5) !important; /* Gold border */
        border-radius: 8px;
        overflow: hidden;
        animation: fadeIn 0.6s ease-out;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    .guests-table thead {
        background: linear-gradient(135deg, #001a4d, #003d99) !important; /* Dark blue gradient header */
        color: #ffb700; /* Gold text */
        font-weight: bold;
    }
    .guests-table thead th {
        border-color: rgba(255, 183, 0, 0.5) !important; /* Gold border */
        padding: 15px;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.5px;
    }
    .guests-table tbody tr {
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
        color: #e0e0e0; /* Lighter text */
    }
    .guests-table tbody tr:hover {
        background: rgba(255, 183, 0, 0.15); /* Subtle gold hover */
        box-shadow: inset 3px 0 0 #ffb700; /* Gold left border on hover */
        transform: scale(1.01);
        color: #ffb700; /* Gold text on hover */
    }
    .guests-table tbody td {
        padding: 12px 15px;
        vertical-align: middle;
    }
    .guest-name {
        color: #ffb700; /* Gold text */
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .guest-contact {
        color: #e0e0e0; /* Lighter text */
    }
    .table-responsive {
        animation: slideUp 0.6s ease-out;
    }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="container-fluid">
    <div class="main-content glass-panel">
        <div class="guests-header">
            <div>
                <h5><i class="bi bi-people"></i> Guest Database</h5>
                <small>Manage and view all registered guests</small>
            </div>
            <img src="https://cdn-icons-png.flaticon.com/512/1524/1524823.png" alt="Guest" style="height: 40px; opacity: 0.8;">
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-sm guests-table mb-0">
                <thead>
                    <tr>
                        <th><i class="bi bi-person-fill"></i> Name</th>
                        <th><i class="bi bi-telephone-fill"></i> Phone</th>
                        <th><i class="bi bi-envelope-fill"></i> Email</th>
                    </tr>
                </thead>
                <tbody>
                    {% for g in guests %}
                    <tr>
                        <td><span class="guest-name"><i class="bi bi-star"></i> {{ g.name }}</span></td>
                        <td><span class="guest-contact">{{ g.phone }}</span></td>
                        <td><span class="guest-contact">{{ g.email }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
