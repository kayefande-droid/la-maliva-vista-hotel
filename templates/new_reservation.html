{% extends 'base.html' %}
{% block content %}
<style>
    /* Specific styles for new_reservation.html, overriding/extending base.html where needed */
    .reservation-header {
        background: linear-gradient(135deg, rgba(0, 21, 51, 0.6), rgba(0, 42, 102, 0.6)); /* Deeper dark blue gradient */
        color: white;
        padding: 25px;
        border-radius: 0.75rem;
        margin-bottom: 25px;
        animation: slideInDown 0.6s ease-out;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.4); /* Glassmorphism border */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }
    .reservation-header h5 {
        color: #ffc107; /* Brighter gold text */
        font-size: 24px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        margin-bottom: 0;
    }
    .reservation-header small {
        color: #f0f0f0; /* Brighter text */
    }
    @keyframes slideInDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .reservation-form {
        background: rgba(255, 255, 255, 0.15); /* Semi-transparent white */
        border: 1px solid rgba(255, 193, 7, 0.5); /* Brighter gold border */
        padding: 25px;
        border-radius: 0.75rem;
        animation: slideInUp 0.6s ease-out;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }
    @keyframes slideInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .form-control, .form-select {
        background-color: rgba(255, 255, 255, 0.15) !important; /* Slightly more opaque */
        border: 1px solid rgba(255, 255, 255, 0.4) !important; /* More prominent border */
        color: #f0f0f0 !important; /* Lighter text */
        transition: all 0.3s ease;
        font-weight: 500;
        border-radius: 0.5rem !important;
    }
    .form-control:focus, .form-select:focus {
        border-color: #ffc107 !important; /* Brighter gold focus */
        box-shadow: 0 0 10px rgba(255, 193, 7, 0.4) !important;
        background-color: rgba(255, 255, 255, 0.25) !important;
    }
    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.7); /* Brighter placeholder */
    }
    .form-label {
        color: #ffc107; /* Brighter gold text */
        font-weight: bold;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .input-group {
        margin-bottom: 18px;
        animation: fadeIn 0.6s ease-out;
    }
    .input-group:nth-child(1) { animation-delay: 0.1s; }
    .input-group:nth-child(2) { animation-delay: 0.2s; }
    .input-group:nth-child(3) { animation-delay: 0.3s; }
    .input-group:nth-child(4) { animation-delay: 0.4s; }
    .input-group:nth-child(5) { animation-delay: 0.5s; }
    .input-group:nth-child(6) { animation-delay: 0.6s; }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
    }
    .submit-btn {
        background: linear-gradient(135deg, #ff9800 0%, #ff5722 100%); /* Orange gradient */
        border: none;
        border-radius: 0.5rem;
        color: #001533; /* Dark text for contrast */
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 14px !important;
        box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        width: 100%;
        font-size: 16px;
        margin-top: 20px;
    }
    .submit-btn:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 10px 25px rgba(255, 152, 0, 0.5);
        background: linear-gradient(135deg, #ffb74d 0%, #ff9800 100%); /* Lighter orange on hover */
    }
    .submit-btn:active {
        transform: translateY(0);
        box-shadow: inset 0 3px 5px rgba(0,0,0,0.4);
    }
    .form-section-title {
        color: #ffc107; /* Brighter gold text */
        font-weight: bold;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 20px;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 2px solid rgba(255, 193, 7, 0.5); /* Brighter gold border */
    }
    .icon-guest { color: #ffc107; } /* Brighter gold icon */
    .icon-room { color: #ffc107; } /* Brighter gold icon */
    .icon-date { color: #ffc107; } /* Brighter gold icon */
    .icon-id { color: #ffc107; } /* Brighter gold icon */
</style>

<div class="container-fluid">
    <div class="main-content glass-panel">
        <div class="reservation-header">
            <div>
                <h5><i class="bi bi-plus-circle"></i> New Reservation</h5>
                <small>Book a luxurious stay at LA-MALIVA VISTA HOTEL</small>
            </div>
            <img src="https://cdn-icons-png.flaticon.com/512/1524/1524815.png" alt="Hotel Key" style="height: 40px; opacity: 0.8;">
        </div>

        <div class="reservation-form">
            <form method="POST">
                <!-- Guest Information -->
                <div class="form-section-title"><i class="bi bi-person"></i> Guest Information</div>

                <div class="input-group">
                    <label for="name" class="form-label"><i class="bi bi-person-fill icon-guest"></i> Full Name</label>
                    <input type="text" name="name" id="name" class="form-control form-control-lg" placeholder="Enter guest name" required>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="input-group">
                            <label for="phone" class="form-label"><i class="bi bi-telephone-fill icon-guest"></i> Phone</label>
                            <input type="text" name="phone" id="phone" class="form-control form-control-lg" placeholder="Phone (+237)" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group">
                            <label for="email" class="form-label"><i class="bi bi-envelope-fill icon-guest"></i> Email</label>
                            <input type="email" name="email" id="email" class="form-control form-control-lg" placeholder="Email address" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="input-group">
                            <label for="place_of_birth" class="form-label"><i class="bi bi-globe icon-guest"></i> Place of Birth</label>
                            <input type="text" name="place_of_birth" id="place_of_birth" class="form-control form-control-lg" placeholder="City, Country" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group">
                            <label for="profession" class="form-label"><i class="bi bi-briefcase icon-guest"></i> Profession</label>
                            <input type="text" name="profession" id="profession" class="form-control form-control-lg" placeholder="Job title" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="input-group">
                            <label for="num_persons" class="form-label"><i class="bi bi-people icon-guest"></i> Number of Persons</label>
                            <input type="number" name="num_persons" id="num_persons" class="form-control form-control-lg" min="1" value="1" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group">
                            <label for="id_passport" class="form-label"><i class="bi bi-card-id icon-id"></i> ID or Passport Number</label>
                            <input type="text" name="id_passport" id="id_passport" class="form-control form-control-lg" placeholder="ID/Passport No." required>
                        </div>
                    </div>
                </div>

                <!-- Room Selection -->
                <div class="form-section-title"><i class="bi bi-door-open"></i> Room Selection</div>

                <div class="input-group">
                    <label for="room_id" class="form-label"><i class="bi bi-box-seam icon-room"></i> Choose Room</label>
                    <select name="room_id" id="room_id" class="form-select form-select-lg" required>
                        <option value="">-- Select a room --</option>
                        {% for room in rooms %}
                        <option value="{{room.id}}" {% if room.id == selected_room_id|int %}selected{% endif %}>Room {{room.room_number}} - {{room.room_type}} (FCFA {{ "{:,.0f}".format(room.price) }})</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Check-in Details -->
                <div class="form-section-title"><i class="bi bi-box-arrow-down"></i> Check-in Details</div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="input-group">
                            <label for="check_in_date" class="form-label"><i class="bi bi-calendar-fill icon-date"></i> Date</label>
                            <input type="date" name="check_in_date" id="check_in_date" class="form-control form-control-lg" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group">
                            <label for="check_in_time" class="form-label"><i class="bi bi-clock-fill icon-date"></i> Time</label>
                            <input type="time" name="check_in_time" id="check_in_time" class="form-control form-control-lg" value="14:00" required>
                        </div>
                    </div>
                </div>

                <!-- Check-out Details -->
                <div class="form-section-title"><i class="bi bi-box-arrow-up"></i> Check-out Details</div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="input-group">
                            <label for="check_out_date" class="form-label"><i class="bi bi-calendar-fill icon-date"></i> Date</label>
                            <input type="date" name="check_out_date" id="check_out_date" class="form-control form-control-lg" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group">
                            <label for="check_out_time" class="form-label"><i class="bi bi-clock-fill icon-date"></i> Time</label>
                            <input type="time" name="check_out_time" id="check_out_time" class="form-control form-control-lg" value="12:00" required>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn w-100">
                    <i class="bi bi-check-circle"></i> Create Reservation
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
