{% extends 'base.html' %}
{% block content %}
<style>
    /* Specific styles for settings.html, overriding/extending base.html where needed */
    .settings-header {
        background: linear-gradient(135deg, rgba(0, 21, 51, 0.6), rgba(0, 42, 102, 0.6)); /* Deeper dark blue gradient */
        color: white;
        padding: 25px;
        border-radius: 0.75rem;
        margin-bottom: 25px;
        animation: slideInDown 0.6s ease-out;
        display: flex;
        align-items: center;
        gap: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.4); /* Glassmorphism border */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }
    @keyframes slideInDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .settings-header h5 {
        color: #ffc107; /* Brighter gold text */
        font-size: 24px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        margin-bottom: 0;
    }
    .settings-header small {
        color: #f0f0f0; /* Brighter text */
    }
    .settings-form {
        background: rgba(255, 255, 255, 0.15); /* Semi-transparent white */
        border: 1px solid rgba(255, 193, 7, 0.5); /* Brighter gold border */
        padding: 30px;
        border-radius: 0.75rem;
        animation: slideInUp 0.6s ease-out;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }
    @keyframes slideInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .form-section {
        margin-bottom: 20px;
        animation: fadeIn 0.6s ease-out;
    }
    .form-section:nth-child(1) { animation-delay: 0.1s; }
    .form-section:nth-child(2) { animation-delay: 0.2s; }
    .form-section:nth-child(3) { animation-delay: 0.3s; }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
    }
    .form-label {
        color: #ffc107; /* Brighter gold text */
        font-weight: bold;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
    }
    .form-control, .form-select {
        background-color: rgba(255, 255, 255, 0.15) !important; /* Slightly more opaque */
        border: 1px solid rgba(255, 255, 255, 0.4) !important; /* More prominent border */
        color: #f0f0f0 !important; /* Lighter text */
        transition: all 0.3s ease;
        font-size: 14px;
        border-radius: 0.5rem !important;
    }
    .form-control:focus, .form-select:focus {
        border-color: #ffc107 !important; /* Brighter gold focus */
        box-shadow: 0 0 10px rgba(255, 193, 7, 0.4) !important;
        background-color: rgba(255, 255, 255, 0.25) !important;
    }
    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.7); /* Brighter placeholder */
    }
    .btn-submit {
        @extend .btn-gold; /* Use the gold gradient button style */
        padding: 12px 30px;
    }
    .alert-success {
        background: rgba(40, 167, 69, 0.25) !important;
        border: 1px solid #28a745 !important;
        color: #f0f0f0 !important; /* Lighter text */
    }
    .alert-success .btn-close {
        filter: invert(1); /* White close button */
    }
</style>

<div class="container-fluid">
    <div class="main-content glass-panel">
        <div class="settings-header">
            <i class="bi bi-gear" style="font-size: 28px; color: #ffc107;"></i>
            <div>
                <h5 class="mb-0">Hotel Settings</h5>
                <small>Manage hotel information and configuration</small>
            </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        <i class="bi bi-{{ 'check-circle' if category == 'success' else 'exclamation-triangle' }}"></i> {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="settings-form">
            <form method="POST">
                <div class="form-section">
                    <label for="name" class="form-label"><i class="bi bi-building"></i> Hotel Name</label>
                    <input type="text" class="form-control form-control-lg" id="name" name="name" value="{{ hotel.name }}" required>
                </div>

                <div class="form-section">
                    <label for="address" class="form-label"><i class="bi bi-geo-alt"></i> Address</label>
                    <textarea class="form-control form-control-lg" id="address" name="address" rows="3" required style="resize: vertical;">{{ hotel.address }}</textarea>
                </div>

                <div class="form-section">
                    <label for="tax_rate" class="form-label"><i class="bi bi-percent"></i> Tax Rate (%)</label>
                    <input type="number" step="0.01" class="form-control form-control-lg" id="tax_rate" name="tax_rate" value="{{ hotel.tax_rate }}" required>
                </div>

                <button type="submit" class="btn btn-submit btn-lg w-100">
                    <i class="bi bi-check-circle"></i> Save Settings
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
